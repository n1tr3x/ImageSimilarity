name: Publish to NuGet

on:
  push:
    branches: [master]
    paths:
      - 'ImageSimilarity/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Тип bump (patch/minor/major)'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write  # нужно для git push коммита с bumped версией

jobs:
  publish:
    # [skip publish] в commit message → workflow не запускается.
    # [skip ci] в commit message → GitHub сам не триггерит workflow повторно
    # после нашего bump-коммита (нет вечного цикла).
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Используем GITHUB_TOKEN для последующего push обратно.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine bump type
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          # Manual run через workflow_dispatch?
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg='${{ github.event.head_commit.message }}'
          if [[ "$msg" == *"[bump:major]"* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [[ "$msg" == *"[bump:minor]"* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in csproj
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CSPROJ=ImageSimilarity/ImageSimilarity.csproj
          CUR=$(grep -oP '(?<=<Version>)[^<]+' $CSPROJ)
          IFS='.' read -ra V <<< "$CUR"
          MAJOR=${V[0]}; MINOR=${V[1]}; PATCH=${V[2]}
          case "${{ steps.bump.outputs.type }}" in
            major) NEW="$((MAJOR+1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "Bumping $CUR -> $NEW (${{ steps.bump.outputs.type }})"
          # Заменяем все три тега. AssemblyVersion / FileVersion идут 4-component (с .0).
          sed -i "s|<Version>${CUR}</Version>|<Version>${NEW}</Version>|" $CSPROJ
          sed -i "s|<AssemblyVersion>${CUR}.0</AssemblyVersion>|<AssemblyVersion>${NEW}.0</AssemblyVersion>|" $CSPROJ
          sed -i "s|<FileVersion>${CUR}.0</FileVersion>|<FileVersion>${NEW}.0</FileVersion>|" $CSPROJ
          echo "old=$CUR" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ImageSimilarity/ImageSimilarity.csproj

      - name: Build
        run: dotnet build ImageSimilarity/ImageSimilarity.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack ImageSimilarity/ImageSimilarity.csproj -c Release --no-build -o ./artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Commit bumped version & tag
        shell: bash
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.new }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ImageSimilarity/ImageSimilarity.csproj
          # [skip ci] в сообщении — чтобы push обратно не триггерил снова этот же workflow.
          git commit -m "chore: bump version to ${NEW} [skip ci]"
          git tag -a "v${NEW}" -m "Release v${NEW}"
          git push origin HEAD:master
          git push origin "v${NEW}"

      - name: Summary
        run: |
          echo "### Published 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ImageSimilarity ${{ steps.version.outputs.new }}** (was ${{ steps.version.outputs.old }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://www.nuget.org/packages/ImageSimilarity/${{ steps.version.outputs.new }}" >> $GITHUB_STEP_SUMMARY
